- name: "Install roihu-agent-env"
  hosts:
    - "roihu_cpu"
    - "roihu_gpu"
  become: false

  tasks:
    - name: "Create directories"
      ansible.builtin.file:
        path: "{{ item }}"
        state: "directory"
        mode: "ug=rwx,o=rx,g+s"
        group: "{{ group }}"
      loop:
        - "{{ appl_dir }}/roihu-agent-env"
        - "{{ appl_dir }}/roihu-agent-env/bin"
        - "{{ appl_dir }}/roihu-agent-env/bin/slurm-mcp"
        - "{{ appl_dir }}/roihu-agent-env/images"
        - "{{ appl_dir }}/roihu-agent-env/apptainer"
        - "{{ appl_dir }}/roihu-agent-env/config"
        - "{{ appl_dir }}/roihu-agent-env/socket-bridge"
        - "{{ appl_dir }}/roihu-agent-env/job-monitoring-sdk"

    - name: "Create directories"
      ansible.builtin.file:
        path: "{{ item }}"
        state: "directory"
        mode: "ug=rwx,o=rx,g+s"
        group: "r_installation_general"
      loop:
        - "{{ modulefiles_dir }}/.roihu-agent-env"
        - "{{ modulefiles_dir }}/.opencode"
        - "{{ modulefiles_dir }}/.claude"
        - "{{ modulefiles_dir }}/.codex"

    - name: "Copy files"
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode }}"
        group: "{{ group }}"
      loop:
        - src: "{{ playbook_dir }}/bin/roihu/wrappers/"
          dest: "{{ appl_dir }}/roihu-agent-env/bin/wrappers/v1/"
          mode: "u=rwx,g=rwx,o=rx"
        - src: "{{ playbook_dir }}/apptainer/"
          dest: "{{ appl_dir }}/roihu-agent-env/apptainer/"
          mode: "u=rwx,g=rwx,o=rx"
        - src: "{{ playbook_dir }}/config/"
          dest: "{{ appl_dir }}/roihu-agent-env/config/"
          mode: "u=rwx,g=rwx,o=rx"
        - src: "{{ playbook_dir }}/socket-bridge/"
          dest: "{{ appl_dir }}/roihu-agent-env/socket-bridge/"
          mode: "u=rwx,g=rwx,o=rx"
        - src: "{{ playbook_dir }}/build_roihu_agent_env.sh"
          dest: "{{ appl_dir }}/roihu-agent-env/build_roihu_agent_env.sh"
          mode: "u=rwx,g=rwx,o=rx"
        - src: "{{ playbook_dir }}/job-monitoring-sdk/"
          dest: "{{ appl_dir }}/roihu-agent-env/job-monitoring-sdk/"
          mode: "u=rwx,g=rwx,o=rx"

    - name: "Create modulefile. For security reasons the group is `r_installation_general`."
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "u=rw,g=rw,o=r"
        group: "r_installation_general"
      loop:
        - src: "{{ playbook_dir }}/modulefiles/roihu/{{ arch }}/module_template"
          dest: "{{ modulefiles_dir }}/.roihu-agent-env/module_template"
        - src: "{{ playbook_dir }}/modulefiles/roihu/{{ arch }}/opencode/"
          dest: "{{ modulefiles_dir }}/.opencode/"
        - src: "{{ playbook_dir }}/modulefiles/roihu/{{ arch }}/claude/"
          dest: "{{ modulefiles_dir }}/.claude/"
        - src: "{{ playbook_dir }}/modulefiles/roihu/{{ arch }}/codex/"
          dest: "{{ modulefiles_dir }}/.codex/"

    - name: "Copy slurm-mcp binaries."
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ appl_dir }}/roihu-agent-env/bin/slurm-mcp/v1/"
        mode: "u=rwx,g=rwx,o=rx"
      with_fileglob:
        - "{{ playbook_dir }}/slurm-mcp/slurm-mcp-linux-{{ arch }}-v*"

    - name: "Create cronjobs for container building."
      ansible.builtin.cron:
        name: "Build roihu-agent-env container"
        minute: "0"
        hour: "5"
        weekday: "0"
        job: "{{ appl_dir }}/roihu-agent-env/build_roihu_agent_env.sh"
